[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
autoshield = "Ej3YoReUDCwKkE1ECt98vg3LE9KopPM2D24Q4a6zddPE"

[programs.devnet]
autoshield = "Ej3YoReUDCwKkE1ECt98vg3LE9KopPM2D24Q4a6zddPE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
bootstrap = "yarn run ts-node scripts/bootstrap.ts"
